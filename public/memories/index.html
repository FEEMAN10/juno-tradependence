<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Resolve all relative assets against /memories/ even when this page is served at the site root -->
<base href="/memories/">
<title>Your Night — Tradependence Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{--orange:#E8690A;--paper:#EDEDEA;--muted:#9a9ea6;--ink:#0B0C0E;--sans:'Source Sans 3',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#191a1e 0%,#050506 60%);color:var(--paper);
  font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:14px;padding:18px}
.head{text-align:center}
.head .kick{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--orange)}
.head h1{margin:4px 0 0;font-size:20px;font-weight:700}
.stagewrap{position:relative;height:min(78vh,760px);aspect-ratio:9/16;border-radius:20px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(237,237,234,.08)}
canvas{display:block;width:100%;height:100%;background:#000}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:radial-gradient(90% 60% at 50% 34%,rgba(232,105,10,.20),rgba(5,5,6,.92));cursor:pointer;z-index:3;transition:opacity .5s}
.poster.hide{opacity:0;pointer-events:none}
.poster img{width:56%;max-width:230px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.poster .pk{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--orange)}
.poster .pn{font-size:30px;font-weight:900;line-height:1;margin-top:-2px}
.poster .psub{font-size:13px;color:var(--muted);margin-top:2px}
.playbtn{margin-top:8px;display:inline-flex;align-items:center;gap:9px;background:var(--orange);color:#140b04;
  font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;border:none;cursor:pointer;box-shadow:0 10px 30px rgba(232,105,10,.4)}
.ctl{display:flex;align-items:center;gap:12px;width:min(78vh*0.5625,428px);max-width:92vw}
.ctl button{background:none;border:1px solid rgba(237,237,234,.2);color:var(--paper);border-radius:999px;
  width:38px;height:38px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ctl button:hover{border-color:var(--orange);color:var(--orange)}
.bar{flex:1;height:5px;background:rgba(237,237,234,.16);border-radius:999px;position:relative;cursor:pointer}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--orange);border-radius:999px}
.time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:66px;text-align:right}
.cap{font-size:12px;color:var(--muted);max-width:460px;text-align:center;line-height:1.5}
.cap b{color:#c9ccd1;font-weight:600}
.revealbtn{margin-top:18px;background:var(--orange);color:#140b04;border:none;border-radius:999px;font-family:var(--sans);font-weight:700;font-size:14px;padding:13px 26px;cursor:pointer;box-shadow:0 10px 30px rgba(232,105,10,.35)}
.revealbtn:active{transform:translateY(1px)}
.gallery{width:min(94vw,520px);margin-top:6px}
.gallery h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);margin:22px 0 10px;text-align:center}
.gallery h2 span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid rgba(237,237,234,.10);background:#111;cursor:zoom-in;transition:transform .12s}
.grid img:hover{transform:scale(1.02)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(4,4,6,.95);display:flex;align-items:center;justify-content:center}
.lb img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
.lb-close{position:absolute;top:14px;right:16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:20px;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:28px;width:46px;height:62px;border-radius:12px;cursor:pointer}
.lb-prev{left:12px}.lb-next{right:12px}
.lb-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px}
.lb-count{color:#c9ccd1;font-size:12.5px;font-variant-numeric:tabular-nums}
.lb-dl{background:var(--orange);color:#140b04;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--sans)}
.ctl2{display:flex;align-items:center;gap:12px;width:min(78vh*0.5625,428px);max-width:92vw;justify-content:space-between}
.seg{display:inline-flex;border:1px solid rgba(237,237,234,.2);border-radius:999px;overflow:hidden}
.seg button{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 15px;cursor:pointer}
.seg button.on{background:var(--orange);color:#140b04}
.expbtn{background:none;border:1px solid rgba(237,237,234,.2);color:var(--paper);border-radius:999px;font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 15px;cursor:pointer}
.expbtn:hover{border-color:var(--orange);color:var(--orange)}
.expbtn[disabled]{opacity:.7;cursor:default}
/* immersive "theater" playback (CSS fullscreen — works on iOS too) */
.stagewrap canvas{cursor:pointer}
.theater-close{position:absolute;top:14px;right:16px;z-index:96;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:17px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center}
.stagewrap.theater{position:fixed;inset:0;z-index:95;height:100vh;height:100dvh;width:100vw;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:#000;display:flex;align-items:center;justify-content:center;margin:0}
.stagewrap.theater canvas{width:auto;height:100vh;height:100dvh;max-width:100vw}
.stagewrap.theater .poster{border-radius:0}
.stagewrap.theater .theater-close{display:flex}
body.theater-on{overflow:hidden}
</style>
</head>
<body>
<div class="head">
  <div class="kick">A Tradependence Memory</div>
  <h1 id="title">Your Night — <span id="who">Andi Wijaya</span></h1>
</div>

<div class="stagewrap" id="stagewrap">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <button class="theater-close" id="theaterClose" aria-label="Close">✕</button>
  <div class="poster" id="poster">
    <img src="../assets/badge.png" alt="">
    <div style="text-align:center">
      <div class="pk">Your Night</div>
      <div class="pn" id="posterName">Andi Wijaya</div>
      <div class="psub">Tradependence Day · 18 Aug 2026</div>
    </div>
    <button class="playbtn">▶ Play your memory</button>
  </div>
</div>

<div class="ctl">
  <button id="playBtn" title="Play/pause">▶</button>
  <button id="restartBtn" title="Restart">↺</button>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="time" id="time">0:00 / 0:00</div>
  <button id="muteBtn" title="Mute">🔊</button>
  <button id="fsBtn" title="Enlarge">⛶</button>
</div>
<div class="ctl2">
  <div class="seg" id="paceSeg"><button data-mode="hype" class="on">Hype</button><button data-mode="cine">Cinematic</button></div>
  <button id="exportBtn" class="expbtn">⤓ Save video</button>
</div>

<div class="cap">Real event photos, <b>ordered by capture time</b> and bucketed into the night’s phases — cut to the <b>“No Random Move”</b> theme (~136 BPM). Every transition and pulse lands on the beat.</div>

<button class="revealbtn" id="revealBtn" style="display:none">See your full memories ▾</button>
<div class="gallery" id="gallery" style="display:none"></div>

<div class="lb" id="lb" style="display:none">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
  <div class="lb-bar"><span class="lb-count" id="lbCount"></span><button class="lb-dl" id="lbDl">⤓ Download</button></div>
</div>

<audio id="track" src="../assets/theme.wav" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="photos.js"></script>
<script>
(function(){
  var C=document.getElementById('stage'), X=C.getContext('2d'), W=1080, H=1920;
  var AUD=document.getElementById('track');
  var PARAMS=new URLSearchParams(location.search);
  var TOKEN=PARAMS.get('g');
  var NAME=PARAMS.get('name')||'Andi Wijaya';
  function setName(n){ NAME=n; document.getElementById('who').textContent=n; document.getElementById('posterName').textContent=n; }
  setName(NAME);

  var BPM=136.36, BEAT=60/BPM, OFFSET=0.06, FADE=0.22, MODE='hype';
  var PHASE_TIME={ARRIVE:'14:00',CONNECT:'16:00',DINE:'19:00',CELEBRATE:'20:35',FAREWELL:'22:20'};
  var PHOTOS=window.MEMORY_PHOTOS||[];   // reel source (guest's photos, or sample fallback)
  var GUEST_PHOTOS=null;                  // the guest's OWN photos (null until resolved)
  var HIGHLIGHTS=[];
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // When opened via a guest link (?g=token), pull THAT guest's real photos + name.
  function resolveGuest(){
    var CFG=window.JUNO_CONFIG||{};
    if(!TOKEN || !window.supabase || !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return Promise.resolve();
    var sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
    return Promise.all([
      sb.rpc('get_guest_photos',{p_token:TOKEN}),
      sb.rpc('get_invitation',{p_token:TOKEN}),
      sb.rpc('get_highlight_photos',{p_token:TOKEN})
    ]).then(function(res){
      var ph=res[0], inv=res[1], hl=res[2];
      GUEST_PHOTOS = (!ph.error && ph.data) ? ph.data.map(function(x){ return {src:x.path, phase:x.phase, time:PHASE_TIME[x.phase]||'', at:x.taken_at}; }) : [];
      if(GUEST_PHOTOS.length) PHOTOS=GUEST_PHOTOS;   // else keep the sample reel so there's always a movie
      if(!inv.error && inv.data && inv.data[0] && inv.data[0].guest_name){ setName(inv.data[0].guest_name); }
      if(!hl.error && hl.data){ HIGHLIGHTS=hl.data.map(function(x){return {src:x.path, phase:x.phase, time:PHASE_TIME[x.phase]||''};}); }
    }).catch(function(){});
  }
  function renderGallery(){
    var g=document.getElementById('gallery'); if(!g) return;
    if(!TOKEN){ g.innerHTML=''; return; }   // gallery only in per-guest mode
    var h='';
    if(GUEST_PHOTOS && GUEST_PHOTOS.length){
      h+='<h2>Photos of '+esc(NAME)+' <span>· '+GUEST_PHOTOS.length+'</span></h2><div class="grid">'+
        GUEST_PHOTOS.map(function(p,i){return '<img loading="lazy" data-set="you" data-i="'+i+'" src="'+esc(p.src)+'">';}).join('')+'</div>';
    } else if(GUEST_PHOTOS){   // resolved, but none tagged yet
      h+='<h2>Photos of '+esc(NAME)+'</h2><p style="text-align:center;color:var(--muted);font-size:13px;margin:0 0 4px">We’re still tagging photos of you — check back soon. Enjoy the highlights below.</p>';
    }
    if(HIGHLIGHTS.length){ h+='<h2>Event highlights <span>· '+HIGHLIGHTS.length+'</span></h2><div class="grid">'+
      HIGHLIGHTS.map(function(p,i){return '<img loading="lazy" data-set="hl" data-i="'+i+'" src="'+esc(p.src)+'">';}).join('')+'</div>'; }
    g.innerHTML=h;
    g.onclick=function(e){ var im=e.target.closest('img'); if(!im)return; var i=+im.dataset.i;
      openLB(im.dataset.set==='you' ? GUEST_PHOTOS.map(function(p){return p.src;}) : HIGHLIGHTS.map(function(p){return p.src;}), i); };
    // reveal-gallery flow: keep it hidden until the guest asks for it (splash-first)
    var rb=document.getElementById('revealBtn');
    if(TOKEN && h){ g.style.display='none'; if(rb) rb.style.display='inline-flex'; }
    else { g.style.display='block'; if(rb) rb.style.display='none'; }
  }

  // ---- lightbox (enlarge + download) ----
  var lbList=[], lbIdx=0, LB=document.getElementById('lb');
  function showLB(){ document.getElementById('lbImg').src=lbList[lbIdx];
    document.getElementById('lbCount').textContent=(lbIdx+1)+' / '+lbList.length; }
  function openLB(list,idx){ if(!list.length)return; lbList=list; lbIdx=idx; showLB(); LB.style.display='flex'; }
  function closeLB(){ LB.style.display='none'; }
  function moveLB(d){ lbIdx=(lbIdx+d+lbList.length)%lbList.length; showLB(); }
  document.getElementById('lbClose').onclick=closeLB;
  document.getElementById('lbPrev').onclick=function(e){ e.stopPropagation(); moveLB(-1); };
  document.getElementById('lbNext').onclick=function(e){ e.stopPropagation(); moveLB(1); };
  document.getElementById('lbDl').onclick=function(e){ e.stopPropagation(); var s=lbList[lbIdx];
    var a=document.createElement('a'); a.href=s; a.download=(s.split('/').pop()||'photo.jpg');
    document.body.appendChild(a); a.click(); a.remove(); };
  LB.onclick=function(e){ if(e.target===LB) closeLB(); };
  document.addEventListener('keydown',function(e){ if(LB.style.display==='none')return;
    if(e.key==='Escape')closeLB(); else if(e.key==='ArrowLeft')moveLB(-1); else if(e.key==='ArrowRight')moveLB(1); });

  var A='../assets/';
  var SRC={badge:'badge.png',bg:'bg.jpg',coin:'coin.png',tagline:'tagline.png',wordmark:'wordmark.png'};
  var IMG={};
  function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}
  function loadAll(){
    var jobs=Object.keys(SRC).map(function(k){return loadImg(A+SRC[k]).then(function(im){IMG[k]=im;});});
    PHOTOS.concat(HIGHLIGHTS).forEach(function(p){ if(p&&!p.im) jobs.push(loadImg(p.src).then(function(im){p.im=im;})); });
    return Promise.all(jobs);
  }
  function audioReady(){return new Promise(function(res){
    if(AUD.readyState>=1&&AUD.duration)res(); else AUD.addEventListener('loadedmetadata',function(){res();},{once:true});
    AUD.addEventListener('error',function(){res();},{once:true});
  });}

  function lerp(a,b,t){return a+(b-a)*t;}
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function ease(t){t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  function rnd(s){var x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);}
  function kb(i,cine){var d=rnd(i)<.5?-1:1,m=cine?1.7:1;return {z0:1.04+rnd(i+1)*0.04,z1:(cine?1.20:1.13)+rnd(i+2)*0.05,
    px0:d*(0.10+rnd(i+3)*0.28)*m,px1:-d*(0.10+rnd(i+4)*0.28)*m,py0:(rnd(i+5)-.5)*0.28*m,py1:(rnd(i+6)-.5)*0.28*m};}
  function beatPunch(T){var ph=(T-OFFSET)/BEAT;if(ph<0)return 0;var idx=Math.floor(ph),frac=ph-idx;
    var amp=(idx%4===0)?0.045:0.025;var d=1-frac;return amp*d*d;}

  // ---- storyboard: title → photos (2 beats each) → end, on the beat grid ----
  var SB=[], TOTAL=0;
  function buildTimeline(){
    var cine=(MODE==='cine');
    FADE=cine?0.5:0.22;
    var pbeats=cine?4:2;
    var list=cine?PHOTOS.filter(function(_,i){return i%2===0;}):PHOTOS.slice();

    // Fill the whole song: if there aren't enough photos to span the music,
    // pad with more pictures (highlights first for variety, then cycle) so the
    // reel never ends on a long static card.
    var trackDur=(AUD.duration&&isFinite(AUD.duration))?AUD.duration:20;
    var TITLE=4, ENDMIN=4;
    var needPhotos=Math.max(list.length, Math.ceil((Math.round(trackDur/BEAT)-TITLE-ENDMIN)/pbeats));
    var pool=HIGHLIGHTS.concat(PHOTOS);
    var j=0;
    while(list.length<needPhotos && pool.length){ list.push(pool[j%pool.length]); j++; }

    SB=[{kind:'title', beats:4}];
    var prevPhase=null;
    list.forEach(function(p){
      SB.push({kind:'photo', im:p.im, phase:p.phase, time:p.time, first:(p.phase!==prevPhase), beats:pbeats});
      prevPhase=p.phase;
    });
    SB.push({kind:'end', beats:ENDMIN});
    var cum=0;
    SB.forEach(function(c,i){ c.i=i; c.kbp=kb(i*7+3,cine); c.start=OFFSET+cum*BEAT; c.dur=c.beats*BEAT; cum+=c.beats; });
    var last=SB[SB.length-1];
    var trackDur=(AUD.duration&&isFinite(AUD.duration))?AUD.duration:(last.start+last.dur);
    last.dur=Math.max(last.dur, trackDur-last.start);
    TOTAL=trackDur;
  }

  function drawCover(img,zoom,px,py,alpha){
    if(!img)return; var iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    var cover=Math.max(W/iw,H/ih), dw=iw*cover*zoom, dh=ih*cover*zoom;
    var x=(W-dw)/2+px*(dw-W)/2, y=(H-dh)/2+py*(dh-H)/2;
    X.globalAlpha=alpha; X.drawImage(img,x,y,dw,dh); X.globalAlpha=1;
  }
  function tone(alpha){X.globalAlpha=alpha;var g=X.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(8,7,5,.30)');g.addColorStop(.5,'rgba(8,7,5,.04)');g.addColorStop(1,'rgba(6,5,4,.58)');
    X.fillStyle=g;X.fillRect(0,0,W,H);X.globalAlpha=1;}
  function drawPhoto(c,localT,alpha,T){
    var p=clamp(localT/c.dur,0,1),k=c.kbp;
    var z=lerp(k.z0,k.z1,ease(p))*(1+beatPunch(T));
    var px=lerp(k.px0,k.px1,ease(p)),py=lerp(k.py0,k.py1,ease(p));
    if(alpha>=1){X.fillStyle='#000';X.fillRect(0,0,W,H);}
    drawCover(c.im,z,px,py,alpha); tone(alpha);
  }
  function card(alpha,body){X.fillStyle='#000';X.globalAlpha=alpha;X.fillRect(0,0,W,H);
    var g=X.createRadialGradient(W/2,H*0.36,60,W/2,H*0.36,W*0.9);g.addColorStop(0,'rgba(232,105,10,.22)');g.addColorStop(1,'rgba(232,105,10,0)');
    X.fillStyle=g;X.fillRect(0,0,W,H);X.globalAlpha=1;body(alpha);}
  function drawTitle(c,localT,alpha,T){card(alpha,function(a){X.globalAlpha=a;X.textAlign='center';
    if(IMG.badge){var bw=W*0.66,bh=IMG.badge.height*(bw/IMG.badge.width);X.drawImage(IMG.badge,(W-bw)/2,H*0.20,bw,bh);}
    X.fillStyle='#F08A2E';X.font='600 34px "Source Sans 3",sans-serif';try{X.letterSpacing='6px';}catch(e){}
    X.fillText('A TRADEPENDENCE MEMORY',W/2,H*0.60);try{X.letterSpacing='0px';}catch(e){}
    X.fillStyle='#F4F4F1';X.font='900 118px "Source Sans 3",sans-serif';X.fillText('Your Night',W/2,H*0.685);
    X.fillStyle='#F4F4F1';X.font='700 64px "Source Sans 3",sans-serif';X.fillText(NAME,W/2,H*0.745);
    X.fillStyle='#c9ccd1';X.font='400 34px "Source Sans 3",sans-serif';X.fillText('Jakarta Phinisi · 18 August 2026',W/2,H*0.80);X.globalAlpha=1;});}
  function drawEnd(c,localT,alpha){card(alpha,function(a){X.globalAlpha=a;X.textAlign='center';
    if(IMG.coin){var cw=W*0.30,ch=IMG.coin.height*(cw/IMG.coin.width);X.drawImage(IMG.coin,(W-cw)/2,H*0.24,cw,ch);}
    X.fillStyle='#F08A2E';X.font='600 30px "Source Sans 3",sans-serif';try{X.letterSpacing='4px';}catch(e){}
    X.fillText('THANKS FOR BOARDING WITH US',W/2,H*0.50);try{X.letterSpacing='0px';}catch(e){}
    X.fillStyle='#F4F4F1';X.font='700 60px "Source Sans 3",sans-serif';X.fillText(NAME,W/2,H*0.565);
    if(IMG.tagline){var tw=W*0.5,th=IMG.tagline.height*(tw/IMG.tagline.width);X.globalAlpha=a*0.95;X.drawImage(IMG.tagline,(W-tw)/2,H*0.63,tw,th);}
    if(IMG.wordmark){var mw=W*0.2,mh=IMG.wordmark.height*(mw/IMG.wordmark.width);X.globalAlpha=a*0.8;X.drawImage(IMG.wordmark,(W-mw)/2,H*0.74,mw,mh);}X.globalAlpha=1;});}

  function overlays(top,topLocalT){
    var v=X.createRadialGradient(W/2,H*0.46,H*0.28,W/2,H*0.5,H*0.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');
    X.fillStyle=v;X.fillRect(0,0,W,H);
    if(top&&top.phase){var a=clamp(topLocalT/0.25,0,1)*clamp((top.dur+FADE-topLocalT)/0.3,0,1);
      if(a>0.01){X.globalAlpha=a;X.textAlign='left';
        X.fillStyle='#F08A2E';X.font='700 40px "Source Sans 3",sans-serif';X.fillText(top.time,70,H-150);
        X.fillStyle='#F4F4F1';X.font='900 72px "Source Sans 3",sans-serif';X.fillText(top.phase,68,H-78);X.globalAlpha=1;}}
    X.globalAlpha=.5;X.textAlign='center';X.fillStyle='#c9ccd1';X.font='600 24px "Source Sans 3",sans-serif';
    try{X.letterSpacing='3px';}catch(e){}X.fillText('JUNO · TRADEPENDENCE DAY 2026',W/2,64);try{X.letterSpacing='0px';}catch(e){}X.globalAlpha=1;
  }

  function render(T){
    X.fillStyle='#000';X.fillRect(0,0,W,H);
    var top=null,topLocal=0;
    for(var i=0;i<SB.length;i++){var c=SB[i];
      if(T>=c.start && T<c.start+c.dur+FADE){
        var localT=T-c.start, alpha=clamp(localT/FADE,0,1); if(i===0)alpha=clamp(localT/0.5,0,1);
        if(c.kind==='photo')drawPhoto(c,localT,alpha,T);
        else if(c.kind==='title')drawTitle(c,localT,alpha,T);
        else if(c.kind==='end')drawEnd(c,localT,alpha);
        if(localT<c.dur){top=c;topLocal=localT;}
      }
    }
    overlays(top,topLocal);
  }

  var poster=document.getElementById('poster'), playBtn=document.getElementById('playBtn'),
      fill=document.getElementById('fill'), timeEl=document.getElementById('time'), bar=document.getElementById('bar');
  var lastT=0;
  function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+('0'+(s%60)).slice(-2);}
  function frame(){
    var T=AUD.paused?lastT:AUD.currentTime; lastT=T;
    render(Math.min(T,TOTAL));
    fill.style.width=(TOTAL?T/TOTAL*100:0)+'%'; timeEl.textContent=fmt(T)+' / '+fmt(TOTAL);
    if(AUD.paused && T>=TOTAL-0.02) playBtn.textContent='↺';
    requestAnimationFrame(frame);
  }
  function play(){ if(AUD.ended||AUD.currentTime>=TOTAL-0.02)AUD.currentTime=0; AUD.play(); playBtn.textContent='❚❚'; poster.classList.add('hide'); }
  function pause(){ AUD.pause(); playBtn.textContent='▶'; }
  playBtn.onclick=function(){ AUD.paused?play():pause(); };
  document.getElementById('restartBtn').onclick=function(){ AUD.currentTime=0; play(); };

  // ---- immersive "theater" playback ----
  var stagewrap=document.getElementById('stagewrap');
  function enterTheater(){ stagewrap.classList.add('theater'); document.body.classList.add('theater-on'); }
  function exitTheater(){ stagewrap.classList.remove('theater'); document.body.classList.remove('theater-on'); }
  poster.onclick=function(){ enterTheater(); play(); };                 // tap the cover -> plays full-screen
  document.getElementById('fsBtn').onclick=function(){ enterTheater(); if(AUD.paused) play(); };
  document.getElementById('theaterClose').onclick=function(e){ e.stopPropagation(); exitTheater(); };
  C.addEventListener('click',function(){ AUD.paused?play():pause(); });  // tap the video to play/pause
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && stagewrap.classList.contains('theater')) exitTheater(); });

  AUD.addEventListener('ended',function(){ playBtn.textContent='↺'; });
  bar.onclick=function(e){var r=bar.getBoundingClientRect();var t=clamp((e.clientX-r.left)/r.width,0,1)*TOTAL;AUD.currentTime=t;lastT=t;if(AUD.paused)render(t);};
  // ---- audio graph (built lazily; needed for export, also carries live sound afterwards) ----
  var actx,asrc,gVol,streamDest,uiMuted=false;
  function ensureGraph(){
    if(actx) { if(actx.state==='suspended')actx.resume(); return; }
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      asrc=actx.createMediaElementSource(AUD); AUD.muted=false;
      gVol=actx.createGain(); gVol.gain.value=uiMuted?0:1;
      asrc.connect(gVol); gVol.connect(actx.destination);
      streamDest=actx.createMediaStreamDestination(); gVol.connect(streamDest);
    }catch(e){}
  }
  document.getElementById('muteBtn').onclick=function(){ uiMuted=!uiMuted;
    if(gVol) gVol.gain.value=uiMuted?0:1; else AUD.muted=uiMuted;
    this.textContent=uiMuted?'🔇':'🔊'; };

  // ---- pace toggle ----
  document.getElementById('paceSeg').addEventListener('click',function(e){
    var b=e.target.closest('[data-mode]'); if(!b||b.dataset.mode===MODE)return;
    MODE=b.dataset.mode;
    [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});
    AUD.pause(); AUD.currentTime=0; lastT=0; buildTimeline(); render(0); playBtn.textContent='▶'; poster.classList.remove('hide');
  });

  // ---- export to video (canvas + audio -> file) ----
  var recording=false, exportBtn=document.getElementById('exportBtn');
  function pickMime(){var c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(var i=0;i<c.length;i++){ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c[i]))return c[i]; } return '';}
  exportBtn.onclick=function(){
    if(recording||!window.MediaRecorder){ if(!window.MediaRecorder)alert('Video export not supported in this browser.'); return; }
    ensureGraph();
    var mime=pickMime(); var prev=gVol?gVol.gain.value:1; if(gVol)gVol.gain.value=1;
    var stream=new MediaStream();
    C.captureStream(30).getVideoTracks().forEach(function(t){stream.addTrack(t);});
    if(streamDest) streamDest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t);});
    var rec; try{ rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:6000000}:{}); }catch(e){ alert('Recorder error: '+e.message); if(gVol)gVol.gain.value=prev; return; }
    var chunks=[]; rec.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); };
    rec.onstop=function(){
      var ext=(mime.indexOf('mp4')>=0)?'mp4':'webm';
      var blob=new Blob(chunks,{type:mime||'video/webm'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='juno-your-night-'+NAME.replace(/\s+/g,'-')+'.'+ext;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      if(gVol)gVol.gain.value=uiMuted?0:prev; recording=false; exportBtn.disabled=false; exportBtn.textContent='⤓ Save video';
    };
    var onEnd=function(){ AUD.removeEventListener('ended',onEnd); if(rec.state!=='inactive')rec.stop(); };
    AUD.addEventListener('ended',onEnd);
    recording=true; exportBtn.disabled=true; exportBtn.textContent='● Recording…';
    poster.classList.add('hide'); AUD.currentTime=0; lastT=0; rec.start(); AUD.play(); playBtn.textContent='❚❚';
  };

  var fr=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  document.getElementById('revealBtn').onclick=function(){
    var g=document.getElementById('gallery'); g.style.display='block'; this.style.display='none';
    g.scrollIntoView({behavior:'smooth',block:'start'});
  };

  resolveGuest().then(function(){ return Promise.all([loadAll(),audioReady(),fr]); })
    .then(function(){ buildTimeline(); render(0); renderGallery(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>

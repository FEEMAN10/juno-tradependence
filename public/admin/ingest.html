<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Juno — Face ingest</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#E8690A;--paper:#EDEDEA;--muted:#9a9ea6;--ink:#0B0C0E;--surface:#15171A;--line:rgba(237,237,234,.12);--sans:'Source Sans 3',system-ui,sans-serif;--ok:#3fae6b;--bad:#d8574f}
*{box-sizing:border-box}
body{margin:0;background:#050506;color:var(--paper);font-family:var(--sans);padding:24px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto}
.kick{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange)}
h1{font-size:22px;font-weight:800;margin:4px 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--paper);padding:11px 12px;font:inherit;font-size:14.5px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#140b04;font-weight:700;border:none;border-radius:11px;padding:12px 20px;font:inherit;font-size:14px;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.pbar{height:6px;background:rgba(237,237,234,.14);border-radius:999px;margin:14px 0;overflow:hidden}
.pbar>div{height:100%;width:0;background:var(--orange);transition:width .2s}
.log{font-size:12.5px;color:var(--muted);max-height:220px;overflow:auto;margin-top:10px;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{font-size:20px;font-weight:800}.stat span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#warn{background:rgba(224,165,59,.12);border:1px solid rgba(224,165,59,.4);color:#e7c079;border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">Juno · Admin</div>
  <h1>Face ingest</h1>
  <p class="sub">Detects faces in the sample photos (in your browser) and stores each face's 128-d fingerprint + metadata into Supabase (pgvector). Re-runnable. This is the pipeline that later runs over your Drive import.</p>

  <div id="warn"></div>

  <!-- login -->
  <div class="card" id="login">
    <div class="kick">Admin sign in</div>
    <form id="loginForm" style="margin-top:8px">
      <input id="email" type="email" placeholder="fh.r@junomarkets.com" autocomplete="username" required>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" type="submit" style="margin-top:6px">Sign in</button>
    </form>
  </div>

  <!-- ingest -->
  <div class="card" id="panel" style="display:none">
    <button class="btn" id="runBtn">▶ Ingest sample photos</button>
    <button class="btn" id="signout" style="background:none;border:1px solid var(--line);color:var(--paper);margin-left:8px">Sign out</button>
    <div class="pbar"><div id="pbar"></div></div>
    <div class="stats" id="stats"></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script src="../config.js"></script>
<script src="../memories/photos.js"></script>
<script>
(function(){
  var MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
  var CFG=window.JUNO_CONFIG||{};
  var LIVE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
  var sb=LIVE?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
  var PHOTOS=window.MEMORY_PHOTOS||[];
  var $=function(id){return document.getElementById(id);};
  function log(m){ $('log').textContent += m+'\n'; $('log').scrollTop=1e9; }
  function warn(m){ var w=$('warn'); w.textContent=m; w.style.display='block'; }

  if(!LIVE) warn('Supabase keys not set in config.js — sign-in and ingest will not work.');

  function showPanel(){ $('login').style.display='none'; $('panel').style.display='block'; }
  function showLogin(){ $('login').style.display='block'; $('panel').style.display='none'; }

  $('loginForm').addEventListener('submit',function(e){ e.preventDefault(); if(!sb){$('loginErr').textContent='Backend not configured.';return;}
    var b=$('loginBtn'); b.disabled=true; b.textContent='Signing in…'; $('loginErr').textContent='';
    sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}).then(function(r){
      b.disabled=false; b.textContent='Sign in';
      if(r.error){ $('loginErr').textContent=r.error.message||'Sign in failed'; return; }
      showPanel();
    });
  });
  $('signout').onclick=function(){ if(sb)sb.auth.signOut().finally(showLogin); };

  var modelsLoaded=false;
  function ensureModels(){ if(modelsLoaded)return Promise.resolve();
    return Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)
    ]).then(function(){modelsLoaded=true;});
  }
  function loadImg(src){return new Promise(function(res){var i=new Image();i.crossOrigin='anonymous';i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}

  $('runBtn').onclick=async function(){
    if(!sb){ warn('No backend.'); return; }
    var btn=$('runBtn'); btn.disabled=true; $('log').textContent=''; $('stats').innerHTML='';
    log('Loading face model…');
    try{ await ensureModels(); }catch(e){ log('Model load failed: '+e.message); btn.disabled=false; return; }
    var totalFaces=0, okPhotos=0;
    for(var i=0;i<PHOTOS.length;i++){
      var p=PHOTOS[i]; $('pbar').style.width=(i/PHOTOS.length*100)+'%';
      var img=await loadImg('../memories/'+p.src);
      if(!img){ log('✗ '+p.src+' (load failed)'); continue; }
      var dets=[];
      try{ dets=await faceapi.detectAllFaces(img,new faceapi.TinyFaceDetectorOptions({inputSize:512,scoreThreshold:0.4})).withFaceLandmarks().withFaceDescriptors(); }catch(e){}
      // upsert photo
      var ph=await sb.rpc('admin_add_photo',{p_path:p.src,p_taken_at:p.at||null,p_phase:p.phase||null,p_width:img.naturalWidth,p_height:img.naturalHeight,p_face_count:dets.length});
      if(ph.error){ log('✗ '+p.src+' -> '+ph.error.message); continue; }
      var photoId=ph.data;
      // faces
      for(var d=0;d<dets.length;d++){ var det=dets[d], b=det.detection.box;
        var emb='['+Array.from(det.descriptor).join(',')+']';
        var bbox={x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.width),h:Math.round(b.height)};
        var fr=await sb.rpc('admin_add_face',{p_photo_id:photoId,p_bbox:bbox,p_embedding:emb});
        if(fr.error){ log('   face err: '+fr.error.message); } else { totalFaces++; }
      }
      okPhotos++; log('✓ '+p.src+' ['+p.phase+'] '+dets.length+' face'+(dets.length===1?'':'s'));
    }
    $('pbar').style.width='100%';
    var st=await sb.rpc('admin_face_stats');
    if(!st.error && st.data && st.data[0]){ var s=st.data[0];
      $('stats').innerHTML =
        '<div class="stat"><b>'+s.photos+'</b><span>Photos</span></div>'+
        '<div class="stat"><b>'+s.faces+'</b><span>Faces</span></div>'+
        '<div class="stat"><b>'+s.highlights+'</b><span>Highlights (no face)</span></div>'+
        '<div class="stat"><b>'+s.unassigned+'</b><span>Unnamed faces</span></div>';
    }
    log('\nDone — '+okPhotos+' photos, '+totalFaces+' faces stored to Supabase.');
    btn.disabled=false;
  };

  if(sb) sb.auth.getSession().then(function(r){ (r.data&&r.data.session)?showPanel():showLogin(); }); else showLogin();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Juno — Name people</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#E8690A;--paper:#EDEDEA;--muted:#9a9ea6;--ink:#0B0C0E;--surface:#15171A;--line:rgba(237,237,234,.12);--sans:'Source Sans 3',system-ui,sans-serif;--ok:#3fae6b;--bad:#d8574f}
*{box-sizing:border-box}
body{margin:0;background:#050506;color:var(--paper);font-family:var(--sans);padding:24px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto}
.kick{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange)}
h1{font-size:22px;font-weight:800;margin:4px 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:720px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,select{background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--paper);padding:10px 12px;font:inherit;font-size:14px}
input{width:100%;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#140b04;font-weight:700;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-size:13.5px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--paper)}
.btn[disabled]{opacity:.55;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
.stat b{font-size:19px;font-weight:800}.stat span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec{font-size:13px;font-weight:700;letter-spacing:.04em;margin:18px 0 10px;color:var(--muted);text-transform:uppercase}
.grp{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.faces{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:200px}
.face{position:relative}
.face canvas{width:62px;height:62px;border-radius:8px;border:1px solid var(--line);display:block;background:#000}
.face input{position:absolute;top:3px;left:3px;width:15px;height:15px;margin:0;accent-color:var(--orange)}
.namebox{display:flex;flex-direction:column;gap:8px;min-width:220px}
.namebox .who{font-weight:700;font-size:14px}
.namebox select{width:100%}
.row2{display:flex;gap:8px}
.pill{font-size:11px;color:var(--muted)}
#warn{background:rgba(224,165,59,.12);border:1px solid rgba(224,165,59,.4);color:#e7c079;border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">Juno · Admin</div>
  <h1>Name the people</h1>
  <p class="sub">Faces from your photos are grouped by similarity. Tag each group with a guest — that mapping powers each guest's private “Photos of You”. Uncheck any face that doesn’t belong before assigning. Everything reads from the vectors already in Supabase.</p>
  <div id="warn"></div>

  <div class="card" id="login">
    <div class="kick">Admin sign in</div>
    <form id="loginForm" style="margin-top:8px">
      <input id="email" type="email" placeholder="fh.r@junomarkets.com" autocomplete="username" required>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" type="submit" style="margin-top:6px">Sign in</button>
    </form>
  </div>

  <div id="panel" style="display:none">
    <div class="stats" id="stats"></div>
    <div id="named"></div>
    <div id="groups"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){
  var CFG=window.JUNO_CONFIG||{}; var LIVE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
  var sb=LIVE?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
  var $=function(id){return document.getElementById(id);};
  var THRESH=0.52;
  var FACES=[], GUESTS=[], IMGS={};

  if(!LIVE){ $('warn').textContent='Supabase keys not set in config.js.'; $('warn').style.display='block'; }

  function showPanel(){ $('login').style.display='none'; $('panel').style.display='block'; load(); }
  function showLogin(){ $('login').style.display='block'; $('panel').style.display='none'; }
  $('loginForm').addEventListener('submit',function(e){ e.preventDefault(); if(!sb)return;
    var b=$('loginBtn'); b.disabled=true; b.textContent='…'; $('loginErr').textContent='';
    sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}).then(function(r){
      b.disabled=false; b.textContent='Sign in'; if(r.error){$('loginErr').textContent=r.error.message;return;} showPanel(); });
  });

  function loadImg(src){return new Promise(function(res){var i=new Image();i.crossOrigin='anonymous';i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}
  function dist(a,b){var s=0;for(var i=0;i<a.length;i++){var d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);}
  function crop(f){var s=62,c=document.createElement('canvas');c.width=s;c.height=s;var x=c.getContext('2d');
    var im=IMGS[f.path]; if(!im){return c;} var b=f.bbox, m=b.w*0.25;
    x.drawImage(im,Math.max(0,b.x-m),Math.max(0,b.y-m),b.w+m*2,b.h+m*2,0,0,s,s);return c;}

  async function load(){
    var fr=await sb.rpc('admin_list_faces'); if(fr.error){alert(fr.error.message);return;}
    FACES=(fr.data||[]).map(function(f){ f.vec=Float32Array.from(JSON.parse(f.embedding)); return f; });
    var gr=await sb.rpc('admin_list_invitations'); GUESTS=(gr.data||[]);
    var paths=Array.from(new Set(FACES.map(function(f){return f.path;})));
    await Promise.all(paths.map(function(p){return loadImg('../memories/'+p).then(function(im){IMGS[p]=im;});}));
    render();
  }

  function guestSelect(){
    var s='<select><option value="">— choose guest —</option>';
    GUESTS.forEach(function(g){ s+='<option value="'+g.id+'">'+(g.guest_name||'?')+(g.guest_title?(' · '+g.guest_title):'')+'</option>'; });
    return s+'</select>';
  }

  function render(){
    // named people (person_id set)
    var byPerson={}; var unassigned=[];
    FACES.forEach(function(f){ if(f.person_id){ (byPerson[f.person_id]=byPerson[f.person_id]||{name:f.person_name,faces:[]}).faces.push(f);} else unassigned.push(f); });

    // cluster the unassigned (greedy)
    var clusters=[];
    unassigned.forEach(function(f){ var best=-1,bd=THRESH;
      for(var c=0;c<clusters.length;c++){ var d=dist(f.vec,clusters[c].c); if(d<bd){bd=d;best=c;} }
      if(best>=0){ var cl=clusters[best]; cl.faces.push(f); var n=cl.faces.length,nd=new Float32Array(f.vec.length);
        for(var k=0;k<nd.length;k++)nd[k]=(cl.c[k]*(n-1)+f.vec[k])/n; cl.c=nd; }
      else clusters.push({c:f.vec.slice(),faces:[f]}); });
    clusters.sort(function(a,b){return b.faces.length-a.faces.length;});

    var namedCount=Object.keys(byPerson).length, assignedFaces=FACES.filter(function(f){return f.person_id;}).length;
    $('stats').innerHTML =
      '<div class="stat"><b>'+FACES.length+'</b><span>Faces</span></div>'+
      '<div class="stat"><b>'+assignedFaces+'</b><span>Named</span></div>'+
      '<div class="stat"><b>'+namedCount+'</b><span>People tagged</span></div>'+
      '<div class="stat"><b>'+clusters.length+'</b><span>Groups to name</span></div>';

    // named section
    var nh='';
    Object.keys(byPerson).forEach(function(pid){ var p=byPerson[pid];
      nh+='<div class="grp" data-pid="'+pid+'"><div class="faces">'+p.faces.map(function(f){return '<div class="face" data-fid="'+f.id+'"></div>';}).join('')+'</div>'+
          '<div class="namebox"><div class="who">✓ '+p.name+'</div><div class="pill">'+p.faces.length+' face(s)</div>'+
          '<button class="btn ghost unname">Un-name</button></div></div>'; });
    $('named').innerHTML = nh?('<div class="sec">Named</div>'+nh):'';

    // groups section
    var gh='<div class="sec">Suggested groups — tag each with a guest</div>';
    if(!clusters.length) gh+='<div class="pill">All faces are named 🎉</div>';
    clusters.forEach(function(cl,i){
      gh+='<div class="grp" data-cluster="'+i+'"><div class="faces">'+
        cl.faces.map(function(f){return '<div class="face" data-fid="'+f.id+'"><input type="checkbox" checked></div>';}).join('')+
        '</div><div class="namebox"><div class="pill">Group '+String.fromCharCode(65+i%26)+' · '+cl.faces.length+' face(s)</div>'+
        guestSelect()+'<button class="btn assign">Assign to guest</button></div></div>';
    });
    $('groups').innerHTML=gh;

    // draw crops
    var allFaces=FACES.reduce(function(m,f){m[f.id]=f;return m;},{});
    document.querySelectorAll('.face').forEach(function(el){ var f=allFaces[el.dataset.fid]; if(f){ var c=crop(f); if(el.querySelector('input')) el.appendChild(c); else el.appendChild(c);} });

    // wire assign
    document.querySelectorAll('#groups .grp').forEach(function(g){
      g.querySelector('.assign').onclick=function(){
        var sel=g.querySelector('select'); var gid=sel.value; if(!gid){sel.focus();return;}
        var ids=[]; g.querySelectorAll('.face').forEach(function(fe){ var cb=fe.querySelector('input'); if(cb&&cb.checked)ids.push(fe.dataset.fid); });
        if(!ids.length)return;
        this.disabled=true; this.textContent='…';
        sb.rpc('admin_name_cluster',{p_face_ids:ids,p_guest_id:gid}).then(function(r){ if(r.error){alert(r.error.message);} load(); });
      };
    });
    document.querySelectorAll('#named .grp').forEach(function(g){
      g.querySelector('.unname').onclick=function(){ var ids=[]; g.querySelectorAll('.face').forEach(function(fe){ids.push(fe.dataset.fid);});
        sb.rpc('admin_unassign_faces',{p_face_ids:ids}).then(function(){ load(); }); };
    });
  }

  if(sb) sb.auth.getSession().then(function(r){ (r.data&&r.data.session)?showPanel():showLogin(); }); else showLogin();
})();
</script>
</body>
</html>

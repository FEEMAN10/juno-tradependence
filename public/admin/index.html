<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Juno Tradependence — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#E8690A; --orange-deep:#C45608; --ink:#0D0E10; --surface:#15171A;
  --surface-2:#1c1f24; --line:rgba(237,237,234,.10); --line-2:rgba(237,237,234,.18);
  --paper:#EDEDEA; --muted:#9a9ea6; --muted-2:#71757d;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --ok:#3fae6b; --bad:#d8574f; --warn:#e0a53b; --shadow:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050506;color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--orange)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14.5px;color:var(--paper);background:var(--surface);
  border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--orange)}
.wrap{max-width:1060px;margin:0 auto;padding:22px 18px 80px}
.mono{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;
  padding:11px 18px;border-radius:11px;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--orange);color:#140b04}
.btn-primary:hover{background:var(--orange-deep)}
.btn-ghost{border-color:var(--line-2);color:var(--paper)}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login .card{width:100%;max-width:380px}
#login h1{margin:6px 0 2px;font-size:24px;font-weight:700}
.field{margin-top:14px}
.field label{display:block;font-size:12px;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}

/* app */
#app{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;line-height:1}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.awaiting-stat{cursor:pointer;border-color:rgba(232,105,10,.4);transition:.15s}
.awaiting-stat:hover{border-color:var(--orange)}
.awaiting-stat .n{color:var(--warn)}
.awaiting-stat.active{background:rgba(232,105,10,.12);border-color:var(--orange)}
.awaiting-stat.active .n{color:var(--orange)}
tr.row-awaiting td{background:rgba(232,105,10,.06)}
tr.row-awaiting td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs .tab{background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs .tab.on{color:var(--paper);border-bottom-color:var(--orange)}
/* faces */
.grp{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grp .faces{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:200px}
.face{position:relative}
.face canvas{width:60px;height:60px;border-radius:8px;border:1px solid var(--line);display:block;background:#000}
.face input{position:absolute;top:3px;left:3px;width:15px;height:15px;margin:0;accent-color:var(--orange)}
.namebox{display:flex;flex-direction:column;gap:8px;min-width:210px}
.namebox select{width:100%}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row .field{margin-top:0;flex:1;min-width:150px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.sec-title h2{margin:0;font-size:16px;font-weight:700}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;text-transform:capitalize}
.pill.accepted{background:rgba(63,174,107,.16);color:#7fd6a0}
.pill.declined{background:rgba(216,87,79,.16);color:#e59790}
.pill.pending{background:rgba(224,165,59,.16);color:#e7c079}
.linkcell{display:flex;align-items:center;gap:6px}
.linkcell code{font-size:11.5px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;font-size:11.5px;color:var(--muted)}
.iconbtn:hover{border-color:var(--orange);color:var(--orange)}
.iconbtn.danger:hover{border-color:var(--bad);color:var(--bad)}
.empty{padding:26px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--surface-2);border:1px solid var(--line-2);padding:11px 18px;border-radius:11px;
  font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.28s;pointer-events:none;max-width:88%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warnbar{background:rgba(224,165,59,.12);border:1px solid rgba(224,165,59,.4);color:#e7c079;
  border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:18px}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="card">
    <div class="kick">Juno Tradependence</div>
    <h1>Admin sign in</h1>
    <p class="muted" style="margin:2px 0 4px;font-size:13.5px">Manage guests, links & responses.</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" required placeholder="you@junomarkets.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:6px" id="loginBtn" type="submit">Sign in</button>
    </form>
  </div>
</section>

<!-- DASHBOARD -->
<section id="app"><div class="wrap">
  <div class="top">
    <div>
      <div class="kick">Juno Tradependence — Admin</div>
      <h1>Guest dashboard</h1>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
      <button class="btn btn-ghost btn-sm" id="csvBtn">⤓ Export CSV</button>
      <button class="btn btn-ghost btn-sm" id="signoutBtn">Sign out</button>
    </div>
  </div>

  <div id="configWarn" class="warnbar" style="display:none">
    ⚠ Supabase keys aren’t set in <code>config.js</code> — the dashboard can’t reach the backend.
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="guests">Guests &amp; responses</button>
    <button class="tab" data-tab="faces">Faces &amp; people</button>
  </div>

  <div id="tab-guests">
  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="kick" style="margin-bottom:10px">Add a guest</div>
    <form id="addForm" class="row">
      <div class="field"><label>Guest name *</label><input id="gName" required placeholder="Mr. Andi Wijaya"></div>
      <div class="field"><label>Seat / table</label><input id="gTitle" placeholder="Table 1"></div>
      <div class="field"><label>Email (optional)</label><input id="gEmail" type="email" placeholder="andi@email.com"></div>
      <button class="btn btn-primary" id="addBtn" type="submit">+ Add & make link</button>
    </form>
  </div>

  <div class="sec-title">
    <h2>Guests & responses <span class="muted mono" id="count"></span></h2>
  </div>
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Guest</th><th>Seat</th><th>RSVP</th><th>Main</th><th>Dessert</th><th>Beverage</th>
        <th>Dietary</th><th>Personal link</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  </div><!-- /tab-guests -->

  <div id="tab-faces" style="display:none">
    <div class="stats" id="fstats"></div>
    <p class="muted" id="fhint" style="font-size:12.5px;margin:0 0 12px"></p>
    <div id="fnamed"></div>
    <div id="fgroups"></div>
  </div>
</div></section>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){
  var CFG = window.JUNO_CONFIG || {};
  var LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
  var sb = LIVE ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

  var $ = function(id){ return document.getElementById(id); };
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2200); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function linkFor(token){ return location.origin + '/?g=' + token; }

  // ---- auth screens ----
  function showLogin(){ $('login').style.display='flex'; $('app').style.display='none'; }
  function showApp(){ $('login').style.display='none'; $('app').style.display='block'; if(!LIVE){ $('configWarn').style.display='block'; } load(); }

  if(!LIVE){
    // No backend configured — let them see the UI but explain.
    $('loginErr').textContent = 'Backend not configured (config.js is blank).';
  }

  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(!sb){ $('loginErr').textContent='Backend not configured.'; return; }
    var btn=$('loginBtn'); btn.disabled=true; btn.textContent='Signing in…'; $('loginErr').textContent='';
    sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value })
      .then(function(res){
        btn.disabled=false; btn.textContent='Sign in';
        if(res.error){ $('loginErr').textContent = res.error.message || 'Sign in failed.'; return; }
        showApp();
      })
      .catch(function(err){ btn.disabled=false; btn.textContent='Sign in'; $('loginErr').textContent = (err&&err.message)||'Sign in failed.'; });
  });

  $('signoutBtn').addEventListener('click', function(){ if(sb) sb.auth.signOut().finally(showLogin); else showLogin(); });

  // ---- data ----
  var DATA = [];

  function load(){
    if(!sb) return;
    sb.rpc('admin_list_invitations').then(function(res){
      if(res.error){ toast('Load failed: '+res.error.message); if(/not authorized/i.test(res.error.message)) return; return; }
      DATA = res.data || [];
      render();
    });
  }

  var filterAwaiting = false;
  function isAwaiting(r){ return r.rsvp_status==='accepted' && !r.selection_at; }

  function render(){
    // stats
    var acc=0,dec=0,pen=0,sub=0,awa=0, mains={};
    DATA.forEach(function(r){
      if(r.rsvp_status==='accepted') acc++; else if(r.rsvp_status==='declined') dec++; else pen++;
      if(r.selection_at) sub++;
      if(isAwaiting(r)) awa++;
      if(r.rsvp_status==='accepted' && r.main_course) mains[r.main_course]=(mains[r.main_course]||0)+1;
    });
    $('stats').innerHTML =
      stat(DATA.length,'Guests') + stat(acc,'Accepted') + stat(dec,'Declined') +
      stat(pen,'Pending') + stat(sub,'Submitted') +
      '<div class="stat awaiting-stat'+(filterAwaiting?' active':'')+'" data-filter="awaiting" title="Accepted but no meal chosen — click to filter">'+
        '<div class="n mono">'+awa+'</div><div class="l">Awaiting meal ▾</div></div>';
    $('count').textContent = DATA.length ? '('+DATA.length+')' : '';

    // rows (optionally filtered to awaiting-meal guests)
    var rows = filterAwaiting ? DATA.filter(isAwaiting) : DATA;
    if(!DATA.length){ $('rows').innerHTML = '<tr><td colspan="9"><div class="empty">No guests yet — add your first one above.</div></td></tr>'; return; }
    if(!rows.length){ $('rows').innerHTML = '<tr><td colspan="9"><div class="empty">🎉 Everyone who accepted has chosen their meal.</div></td></tr>'; return; }
    $('rows').innerHTML = rows.map(function(r){
      var diet = r.dietary_flag ? (esc(r.dietary_note)||'yes') : '';
      return '<tr class="'+(isAwaiting(r)?'row-awaiting':'')+'">'+
        '<td><strong>'+esc(r.guest_name)+'</strong>'+(r.email?'<div class="muted" style="font-size:11.5px">'+esc(r.email)+'</div>':'')+'</td>'+
        '<td>'+esc(r.guest_title)+'</td>'+
        '<td><span class="pill '+esc(r.rsvp_status)+'">'+esc(r.rsvp_status)+'</span></td>'+
        '<td>'+esc(r.main_course)+'</td>'+
        '<td>'+esc(r.dessert)+'</td>'+
        '<td>'+esc(r.beverage)+'</td>'+
        '<td>'+diet+'</td>'+
        '<td><div class="linkcell"><code>?g='+esc(r.token)+'</code>'+
          '<button class="iconbtn" data-copy="'+esc(linkFor(r.token))+'">Copy</button></div></td>'+
        '<td style="text-align:right"><div style="display:inline-flex;gap:6px">'+
          (r.selection_at?'<button class="iconbtn" data-reset="'+r.id+'" title="Let them re-pick">Reset</button>':'')+
          '<button class="iconbtn danger" data-del="'+r.id+'" data-name="'+esc(r.guest_name)+'">Del</button>'+
        '</div></td>'+
      '</tr>';
    }).join('');
  }
  function stat(n,l){ return '<div class="stat"><div class="n mono">'+n+'</div><div class="l">'+l+'</div></div>'; }
  $('stats').addEventListener('click', function(e){
    var s=e.target.closest('[data-filter="awaiting"]'); if(!s) return;
    filterAwaiting=!filterAwaiting; render();
    if(filterAwaiting) document.querySelector('.sec-title').scrollIntoView({behavior:'smooth',block:'start'});
  });

  // ---- add guest ----
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(!sb){ toast('Backend not configured.'); return; }
    var btn=$('addBtn'); btn.disabled=true; btn.textContent='Adding…';
    sb.rpc('admin_add_guest', { p_name:$('gName').value, p_title:$('gTitle').value, p_email:$('gEmail').value })
      .then(function(res){
        btn.disabled=false; btn.textContent='+ Add & make link';
        if(res.error){ toast('Add failed: '+res.error.message); return; }
        $('gName').value=$('gTitle').value=$('gEmail').value='';
        var row = res.data;
        DATA.push(row); render();
        var link = linkFor(row.token);
        if(navigator.clipboard){ navigator.clipboard.writeText(link).then(function(){toast('Added — link copied to clipboard');},function(){toast('Added: '+link);}); }
        else toast('Added: '+link);
      })
      .catch(function(err){ btn.disabled=false; btn.textContent='+ Add & make link'; toast('Add failed'); });
  });

  // ---- row actions (copy / delete / reset) ----
  $('rows').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.copy){
      var v=b.dataset.copy;
      if(navigator.clipboard) navigator.clipboard.writeText(v).then(function(){toast('Link copied');},function(){toast(v);});
      else toast(v);
    } else if(b.dataset.del){
      if(!confirm('Delete '+b.dataset.name+'? This removes their row and response.')) return;
      sb.rpc('admin_delete_guest',{p_id:b.dataset.del}).then(function(res){
        if(res.error){ toast('Delete failed: '+res.error.message); return; }
        DATA = DATA.filter(function(r){return r.id!==b.dataset.del;}); render(); toast('Deleted');
      });
    } else if(b.dataset.reset){
      if(!confirm('Reset this guest’s meal choice so they can pick again?')) return;
      sb.rpc('admin_reset_selection',{p_id:b.dataset.reset}).then(function(res){
        if(res.error){ toast('Reset failed: '+res.error.message); return; }
        toast('Choice reset'); load();
      });
    }
  });

  // ---- refresh / csv ----
  $('refreshBtn').addEventListener('click', function(){ load(); toast('Refreshed'); });
  $('csvBtn').addEventListener('click', function(){
    var head=['guest_name','seat','email','rsvp_status','main_course','dessert','beverage','dietary','link'];
    var lines=[head.join(',')];
    DATA.forEach(function(r){
      var diet=r.dietary_flag?(r.dietary_note||'yes'):'';
      var cells=[r.guest_name,r.guest_title,r.email,r.rsvp_status,r.main_course,r.dessert,r.beverage,diet,linkFor(r.token)];
      lines.push(cells.map(function(c){ c=(c==null?'':String(c)); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','));
    });
    var blob=new Blob([lines.join('\n')],{type:'text/csv'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='juno-guests.csv'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  });

  // ==== FACES & PEOPLE tab (reuses DATA guest list; no ML — vectors already in Supabase) ====
  var FTHRESH=0.52, FACES=null, FIMGS={}, facesLoaded=false;
  function fdist(a,b){var s=0;for(var i=0;i<a.length;i++){var d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);}
  function floadImg(src){return new Promise(function(res){var i=new Image();i.crossOrigin='anonymous';i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}
  function fcrop(f){var s=60,c=document.createElement('canvas');c.width=s;c.height=s;var x=c.getContext('2d');
    var im=FIMGS[f.path];if(!im)return c;var b=f.bbox,m=b.w*0.25;
    x.drawImage(im,Math.max(0,b.x-m),Math.max(0,b.y-m),b.w+m*2,b.h+m*2,0,0,s,s);return c;}
  function fguestSelect(){ var s='<select><option value="">— choose guest —</option>';
    DATA.forEach(function(g){ s+='<option value="'+g.id+'">'+esc(g.guest_name)+(g.guest_title?(' · '+esc(g.guest_title)):'')+'</option>'; });
    return s+'</select>'; }

  function loadFaces(){
    if(!sb) return;
    $('fhint').textContent='Loading faces…'; $('fnamed').innerHTML=''; $('fgroups').innerHTML='';
    sb.rpc('admin_list_faces').then(function(fr){
      if(fr.error){ $('fhint').innerHTML='⚠ Naming functions not installed yet. Run <code>supabase/people.sql</code> once, then reopen this tab. ('+esc(fr.error.message)+')'; return; }
      FACES=(fr.data||[]).map(function(f){ f.vec=Float32Array.from(JSON.parse(f.embedding)); return f; });
      if(!FACES.length){ $('fhint').innerHTML='No faces yet. Run the <a href="ingest.html">ingest tool</a> first.'; $('fstats').innerHTML=''; return; }
      var paths=Array.from(new Set(FACES.map(function(f){return f.path;})));
      Promise.all(paths.map(function(p){return floadImg('../memories/'+p).then(function(im){FIMGS[p]=im;});})).then(function(){ facesLoaded=true; renderFaces(); });
    });
  }
  function renderFaces(){
    var byPerson={}, un=[];
    FACES.forEach(function(f){ if(f.person_id){(byPerson[f.person_id]=byPerson[f.person_id]||{name:f.person_name,faces:[]}).faces.push(f);} else un.push(f); });
    var clusters=[];
    un.forEach(function(f){ var best=-1,bd=FTHRESH;
      for(var c=0;c<clusters.length;c++){var d=fdist(f.vec,clusters[c].c);if(d<bd){bd=d;best=c;}}
      if(best>=0){var cl=clusters[best];cl.faces.push(f);var n=cl.faces.length,nd=new Float32Array(f.vec.length);for(var k=0;k<nd.length;k++)nd[k]=(cl.c[k]*(n-1)+f.vec[k])/n;cl.c=nd;}
      else clusters.push({c:f.vec.slice(),faces:[f]}); });
    clusters.sort(function(a,b){return b.faces.length-a.faces.length;});

    var named=FACES.filter(function(f){return f.person_id;}).length;
    $('fstats').innerHTML=
      '<div class="stat"><div class="n mono">'+FACES.length+'</div><div class="l">Faces</div></div>'+
      '<div class="stat"><div class="n mono">'+named+'</div><div class="l">Named</div></div>'+
      '<div class="stat"><div class="n mono">'+Object.keys(byPerson).length+'</div><div class="l">People tagged</div></div>'+
      '<div class="stat"><div class="n mono">'+clusters.length+'</div><div class="l">Groups to name</div></div>';
    $('fhint').textContent='Tag each group with a guest. Uncheck any face that doesn’t belong first.';

    var nh='';
    Object.keys(byPerson).forEach(function(pid){var p=byPerson[pid];
      nh+='<div class="grp" data-pid="'+pid+'"><div class="faces">'+p.faces.map(function(f){return '<div class="face" data-fid="'+f.id+'"></div>';}).join('')+
        '</div><div class="namebox"><div style="font-weight:700">✓ '+esc(p.name||'Named')+'</div><div class="muted" style="font-size:12px">'+p.faces.length+' face(s)</div>'+
        '<button class="btn btn-ghost btn-sm funname">Un-name</button></div></div>'; });
    $('fnamed').innerHTML=nh?('<div class="sec-h">Named</div>'+nh):'';

    var gh='<div class="sec-h">Suggested groups</div>';
    if(!clusters.length) gh+='<div class="muted">All faces are named 🎉</div>';
    clusters.forEach(function(cl,i){ gh+='<div class="grp"><div class="faces">'+
      cl.faces.map(function(f){return '<div class="face" data-fid="'+f.id+'"><input type="checkbox" checked></div>';}).join('')+
      '</div><div class="namebox"><div class="muted" style="font-size:12px">Group '+String.fromCharCode(65+i%26)+' · '+cl.faces.length+' face(s)</div>'+
      fguestSelect()+'<button class="btn btn-primary funassign">Assign to guest</button></div></div>'; });
    $('fgroups').innerHTML=gh;

    var map={}; FACES.forEach(function(f){map[f.id]=f;});
    document.querySelectorAll('#tab-faces .face').forEach(function(el){var f=map[el.dataset.fid];if(f)el.appendChild(fcrop(f));});
    document.querySelectorAll('#fgroups .grp').forEach(function(g){ g.querySelector('.funassign').onclick=function(){
      var sel=g.querySelector('select'),gid=sel.value; if(!gid){sel.focus();return;}
      var ids=[]; g.querySelectorAll('.face').forEach(function(fe){var cb=fe.querySelector('input');if(cb&&cb.checked)ids.push(fe.dataset.fid);});
      if(!ids.length)return; this.disabled=true; this.textContent='…';
      sb.rpc('admin_name_cluster',{p_face_ids:ids,p_guest_id:gid}).then(function(r){ if(r.error){toast('Assign failed: '+r.error.message);} else {toast('Tagged');} loadFaces(); }); }; });
    document.querySelectorAll('#fnamed .grp').forEach(function(g){ g.querySelector('.funname').onclick=function(){
      var ids=[]; g.querySelectorAll('.face').forEach(function(fe){ids.push(fe.dataset.fid);});
      sb.rpc('admin_unassign_faces',{p_face_ids:ids}).then(function(){ toast('Un-named'); loadFaces(); }); }; });
  }

  // tab switching
  document.querySelector('.tabs').addEventListener('click', function(e){
    var b=e.target.closest('.tab'); if(!b)return;
    [].forEach.call(this.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x===b);});
    var t=b.dataset.tab;
    $('tab-guests').style.display = t==='guests'?'block':'none';
    $('tab-faces').style.display  = t==='faces'?'block':'none';
    if(t==='faces') loadFaces();
  });

  // ---- boot: resume session if already signed in ----
  if(sb){
    sb.auth.getSession().then(function(res){
      if(res.data && res.data.session) showApp(); else showLogin();
    }).catch(showLogin);
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
